<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Английский алфавит для детей</title><meta name="description" content="Нажимай на буквы и слушай английский алфавит."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232c77df'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='43' font-family='Arial' font-weight='bold' fill='white'%3EA%3C/text%3E%3C/svg%3E"><style>
:root{font-family:Trebuchet MS,Arial,sans-serif;color:#173564;background:#dff3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 8%,#fff9bc 0 9%,transparent 22%),radial-gradient(circle at 95% 75%,#ffd2e8 0 9%,transparent 24%),#e4f5ff}main{max-width:1080px;margin:auto;padding:24px 18px 52px;text-align:center}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.1;margin:12px 0 8px;color:#2352a5;text-shadow:2px 3px #fff}p{font-size:1.05rem;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.letter{position:relative;min-height:116px;border:4px solid #fff;border-radius:25px;box-shadow:0 6px 0 #aac5de,0 9px 17px #3971a72e;background:var(--bg);color:var(--ink);cursor:pointer;font:900 clamp(2.3rem,5vw,4.1rem)/1 Trebuchet MS,Arial,sans-serif;transition:transform .15s,box-shadow .15s;touch-action:manipulation}.letter:hover,.letter:focus-visible{transform:translateY(-4px);box-shadow:0 10px 0 #aac5de,0 14px 20px #3971a73a;outline:3px solid #2352a5;outline-offset:2px}.letter:active,.letter.playing{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 #aac5de}.letter:nth-child(5n+1){--bg:#ffdd72;--ink:#9d4300}.letter:nth-child(5n+2){--bg:#ffb8d5;--ink:#a02267}.letter:nth-child(5n+3){--bg:#a6e7ff;--ink:#145da9}.letter:nth-child(5n+4){--bg:#b8ef9c;--ink:#367136}.letter:nth-child(5n){--bg:#d7c2ff;--ink:#633fa1}.letter small{display:block;font-size:.38em;letter-spacing:.03em;margin-top:7px;color:#385279}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:29px}.read{border:0;border-radius:999px;padding:17px 28px;background:#2767d5;color:white;font:800 1.15rem Trebuchet MS,Arial,sans-serif;box-shadow:0 6px 0 #16438f;cursor:pointer;min-height:58px}.read:hover,.read:focus-visible{background:#174fab;outline:3px solid #ffbd34;outline-offset:3px}.read:active{transform:translateY(4px);box-shadow:0 2px 0 #16438f}.status{min-height:1.4em;margin-top:16px;color:#314a70;font-size:.95rem}@media(max-width:700px){main{padding:19px 13px 40px}.grid{grid-template-columns:repeat(4,1fr);gap:10px}.letter{min-height:82px;border-radius:19px;font-size:2.5rem;border-width:3px}.letter small{margin-top:3px}p{margin-bottom:20px}}@media(max-width:380px){.grid{gap:7px}.letter{min-height:72px;font-size:2.1rem}}
 .credit{margin-top:20px;font-size:.75rem;color:#527092}.credit a{color:inherit}</style></head><body><main><h1>Английский алфавит</h1><p>Нажми на букву и послушай, как она звучит!</p><div class="grid" id="alphabet" aria-label="Буквы английского алфавита"></div><div class="actions"><button class="read" id="read" type="button">🔊 Прочитать алфавит полностью</button><button class="read" id="readFast" type="button">🔊 Прочитать алфавит быстрее</button></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="credit">Голос: <a href="https://commons.wikimedia.org/wiki/File:Alphabet.oga">Obsweant</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · запись разделена на буквы</div></main><script>
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const segments=[[0,0.629792],[0.729792,0.358792],[1.188583,0.544542],[1.833125,0.335],[2.268125,0.418792],[2.786917,0.271],[3.157917,0.36675],[3.624667,0.222125],[3.946792,0.413],[4.459792,0.437208],[4.997,0.459],[5.556,0.392292],[6.048292,0.319875],[6.468167,0.354917],[6.923083,0.370792],[7.393875,0.3815],[7.875375,0.483417],[8.458792,0.433375],[8.992167,0.319792],[9.411958,0.3675],[9.879458,0.404583],[10.384042,0.314583],[10.798625,0.539292],[11.437917,0.462833],[12.00075,0.507875],[12.608625,0.5285]];
const grid=document.getElementById('alphabet'),read=document.getElementById('read'),readFast=document.getElementById('readFast'),status=document.getElementById('status');
let run=0,active=null,timer=null,activeRead=null,currentSource=null,context=null,bufferPromise=null;
const audioData=fetch('alphabet-voice.mp3').then(r=>{if(!r.ok)throw new Error('audio');return r.arrayBuffer()});
letters.forEach(l=>{const b=document.createElement('button');b.type='button';b.className='letter';b.innerHTML=`${l}<small>${l.toLowerCase()}</small>`;b.setAttribute('aria-label',`Буква ${l}, произнести`);b.addEventListener('click',()=>{stop();playLetter(l,b)});grid.appendChild(b)});
function stop(){run++;clearTimeout(timer);if(currentSource){try{currentSource.stop()}catch{}currentSource=null}active?.classList.remove('playing');active=null;activeRead=null;read.textContent='🔊 Прочитать алфавит полностью';readFast.textContent='🔊 Прочитать алфавит быстрее';status.textContent=''}
function getAudio(){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('unsupported');if(!context)context=new AudioContextClass();context.resume();if(!bufferPromise)bufferPromise=audioData.then(data=>context.decodeAudioData(data.slice(0)));return bufferPromise}
async function playLetter(l,b,done){const token=run;status.textContent='Загружаем озвучивание…';try{const buffer=await getAudio();if(token!==run)return;const [start,duration]=segments[letters.indexOf(l)];const source=context.createBufferSource();source.buffer=buffer;source.connect(context.destination);currentSource=source;active=b;b.classList.add('playing');status.textContent=`Слушаем: ${l}`;source.onended=()=>{if(token!==run)return;b.classList.remove('playing');active=null;currentSource=null;done?.()};source.start(0,start,duration)}catch{if(token===run){activeRead=null;read.textContent='🔊 Прочитать алфавит полностью';readFast.textContent='🔊 Прочитать алфавит быстрее';status.textContent='Не удалось загрузить озвучивание. Попробуйте обновить страницу.'}}}
function startReading(button,pause){if(activeRead===button){stop();return}stop();activeRead=button;button.textContent='■ Остановить чтение';const token=run;let i=0;function next(){if(token!==run||activeRead!==button)return;if(i===letters.length){stop();status.textContent='Алфавит прочитан!';return}const l=letters[i++];playLetter(l,grid.children[i-1],()=>{timer=setTimeout(next,pause)})}next()}
read.addEventListener('click',()=>startReading(read,420));
readFast.addEventListener('click',()=>startReading(readFast,210));
</script></body></html>
